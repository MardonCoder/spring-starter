services:  # определяется набор запускаемых контейнеров
  postgres:  # имя сервиса
    image: postgres:18.6
    container_name: app_postgres
    environment:  # env, передается контейнеру при старте
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:  # глобальные тома докера
  postgres_data:  # Создает персистентный том (не удаляется при перезапуске или docker compose down).