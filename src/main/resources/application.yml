db:
  username: ${username.value:postgres}
  password: pass
  driver: PostgresDriver
  url: posgres:5432
  hosts: localhost,127.0.0.1
  properties:
    first: 123
    second: 456
    third.value: Third
  pool:
    size: 12
    timeout: 10
  pools:
    - size: 1
      timeout: 1
    - size: 2
      timeout: 2
    - size: 3
      timeout: 3
#spring.profiles.active: qa

logging:
  level:
    root: info
    org.mardon.spring.database.pool: info
    org.springframework.jdbc.core: trace
#  file:
#    name: dele.log
#    path: /

spring:
  docker:
    compose:
      # Поведение при старте: always, if-running, ignore (по умолчанию: always)
      lifecycle-management: start-and-stop
      # Поведение при остановке приложения: stop, down (down удалит контейнеры и сеть)
      stop:
        command: stop
      # Тайм-аут ожидания готовности контейнера
      readiness:
        timeout: 2m

  sql:
    init:
      mode: always # Выполнять скрипты всегда (never, embedded, always)
      schema-locations:
        - classpath:sql/schema.sql
        - classpath:sql/audit.sql
      data-locations: classpath:sql/data.sql

  jpa:
    properties:
      hibernate:
        batch_size: 50
        fetch_size: 50
        show_sql: true
        format_sql: true
        hbm2ddl.auto: validate
